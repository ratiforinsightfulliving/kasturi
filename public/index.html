<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasturi CRM</title>
  <meta name="theme-color" content="#173b29">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
  <script>
    // Apply the saved theme before first paint (light | dark | system).
    try { var t = localStorage.getItem('kx_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app"><div class="boot"><img src="/img/logo.png" alt="Kasturi" height="48"></div></div>
  <noscript>Kasturi CRM needs JavaScript enabled.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
